apiVersion: apps/v1
kind: Deployment
metadata:
  name: deip-gateway
  namespace: deip-production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: deip-gateway
  template:
    metadata:
      labels:
        app: deip-gateway
    spec:
      containers:
      - name: gateway
        image: deip/api-gateway:v2.2.0
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://electoral_admin:$(POSTGRES_PASSWORD)@postgres.deip-production.svc.cluster.local:5432/electoral_db"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: deip-secrets
              key: postgres-password
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: deip-gateway
  namespace: deip-production
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
  selector:
    app: deip-gateway
