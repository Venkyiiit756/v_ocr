version: '3.8'

services:
  # ===========================================================================
  # PostgreSQL 16 Enterprise Partitioned Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: deip_postgres
    restart: always
    environment:
      POSTGRES_DB: electoral_db
      POSTGRES_USER: electoral_admin
      POSTGRES_PASSWORD: secret_electoral_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../../sql/01_master_electors_ddl.sql:/docker-entrypoint-initdb.d/01_master_electors_ddl.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U electoral_admin -d electoral_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # RabbitMQ AMQP 0-9-1 Message Broker
  # ===========================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: deip_rabbitmq
    restart: always
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ===========================================================================
  # MinIO S3-Compatible Object Store for PDF & 300 DPI Card Crops
  # ===========================================================================
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: deip_minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  # ===========================================================================
  # REST API Gateway (FastAPI)
  # ===========================================================================
  api-gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gateway
    container_name: deip_api_gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://electoral_admin:secret_electoral_pass@postgres:5432/electoral_db
      USE_SQLITE: "false"
    depends_on:
      postgres:
        condition: service_healthy

  # ===========================================================================
  # OCR Worker Fleet
  # ===========================================================================
  ocr-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    container_name: deip_ocr_worker
    restart: always
    environment:
      DATABASE_URL: postgresql://electoral_admin:secret_electoral_pass@postgres:5432/electoral_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pg_data:
  minio_data:
